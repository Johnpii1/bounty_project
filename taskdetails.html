<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Task</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4">
    <h1 class="text-xl font-bold">Task Details</h1>
  </header>

  <!-- Main Content -->
  <main class="p-6 max-w-3xl mx-auto">

    <!-- Task Card -->
    <div class="bg-white shadow-md rounded-lg p-6 mb-6">
      <h2 class="text-2xl font-semibold mb-2" id="taskTitle">Task Title Here</h2>
      <p class="text-gray-700 mb-4" id="taskDescription">
        Task description goes here. This can be several lines explaining the task in detail.
      </p>

      <!-- Task Info -->
      <div class="flex flex-wrap gap-4 text-gray-600 mb-4">
        <span><strong>Due:</strong> <span id="taskDue">2026-03-20</span></span>
        <span><strong>Status:</strong> <span id="taskStatus" class="text-green-600">Pending</span></span>
        <span><strong>Assigned to:</strong> <span id="taskAssignee">John Doe</span></span>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3">
        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700" id="editTaskBtn">
          Edit Task
        </button>
        <button class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700" id="deleteTaskBtn">
          Delete Task
        </button>
      </div>
    </div>

    <!-- Comments Section -->
    <section class="bg-white shadow-md rounded-lg p-6">
      <h3 class="text-xl font-semibold mb-4">Comments</h3>
      <ul id="commentsList" class="space-y-3">
        <li class="p-3 bg-gray-100 rounded">This task needs review before submission.</li>
        <li class="p-3 bg-gray-100 rounded">Deadline has been moved to tomorrow.</li>
      </ul>

      <!-- Add Comment -->
      <div class="mt-4 flex gap-2">
        <input type="text" placeholder="Add a comment..." class="flex-1 p-2 border rounded" id="newComment">
        <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700" id="addCommentBtn">
          Add
        </button>
      </div>
    </section>

  </main>

</body>
</html>
