<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="bg-gray-800 w-64 p-6 fixed inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-20">
      <h2 class="text-2xl font-bold mb-6">Admin Panel</h2>
      <nav class="flex flex-col gap-3">
        <a href="#" class="px-3 py-2 rounded bg-gray-700">Dashboard</a>
        <a href="#" class="px-3 py-2 rounded hover:bg-gray-700">Users</a>
        <a href="#" class="px-3 py-2 rounded hover:bg-gray-700">Deposits</a>
        <a href="#" class="px-3 py-2 rounded hover:bg-gray-700">Withdrawals</a>
      </nav>
    </aside>

    <!-- OVERLAY FOR MOBILE -->
    <div id="overlay" class="fixed inset-0 bg-black opacity-50 hidden z-10 md:hidden"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-6 md:ml-64">

      <!-- HEADER -->
      <header class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-4">
          <!-- Hamburger Menu -->
          <button id="menuBtn" class="md:hidden bg-gray-700 p-2 rounded">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <h1 class="text-2xl font-bold">Dashboard</h1>
        </div>
        <button class="bg-red-600 px-4 py-2 rounded hover:bg-red-500">Logout</button>
      </header>

      <!-- DASHBOARD CARDS -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
        <div class="bg-gray-800 p-4 rounded shadow">
          <h2 class="text-lg font-semibold">Total Users</h2>
          <p class="text-2xl font-bold mt-2">120</p>
        </div>
        <div class="bg-gray-800 p-4 rounded shadow">
          <h2 class="text-lg font-semibold">Total Deposits</h2>
          <p class="text-2xl font-bold mt-2">$10,500</p>
        </div>
        <div class="bg-gray-800 p-4 rounded shadow">
          <h2 class="text-lg font-semibold">Total Withdrawals</h2>
          <p class="text-2xl font-bold mt-2">$3,200</p>
        </div>
        <div class="bg-gray-800 p-4 rounded shadow">
          <h2 class="text-lg font-semibold">Admin Earnings (10%)</h2>
          <p class="text-2xl font-bold mt-2">$1,050</p>
        </div>
      </div>

      <!-- QUICK STATS / PLACEHOLDER -->
      <div class="bg-gray-800 p-4 rounded shadow">
        <h2 class="text-lg font-semibold mb-2">Quick Stats / Activity</h2>
        <p>Here you can add recent deposits, pending withdrawals, or other activity widgets.</p>
      </div>

    </main>
  </div>

</body>
<script type="module" src="./admin.js"></script>
</html>
