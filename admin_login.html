<html lang="en">

 <!-- TAILWIND -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet">



<body class="bg-black overflow-x-hidden font">
    

      <!-- HEADER -->
    <div
        class="flex justify-between items-center p-2 md:p-6 bg-[#2D2D2D] h-[55px] border border-white/40 w-full sticky top-0 z-50">

        <div>
            <a href="./user_dashboard.html">
                <img class="h-[100px] mt-2.5 object-contain" src="./image/HappyBounty.png">
            </a>
        </div>

        <div class="flex flex-row items-center gap-2 font-semibold text-white">

            <!-- PLUS   -->
      <button class="relative plusbtn"><i class="bi bi-plus text-2xl"></i>

        <div
          class="plusmenu hidden absolute border boredr-[#2D2D2D] min-w-[240px] max-w-[650px] bg-white h-auto py-2 top-[2.4rem] right-0 rounded-lg text-black flex flex-col text-start px-2 z-50 text-sm">
            
          <!-- CLOSE BTNS -->
           <div class="close-btn text-black ml-auto hover:bg-gray-200 rounded-lg  py-1 px-2">X</div>
          
          <a class="text-black hover:bg-gray-200 rounded-lg  py-1 px-2" href="./create.html">Create</a>
          <div class="text-black hover:bg-gray-200 rounded-lg  py-1 px-2">Active</div>
          <div class="text-black hover:bg-gray-200 rounded-lg  py-1 px-2">Completed</div>
        </div>

      </button>





      <!-- PEOFILE -->
<div id="profileCircle" class="rounded-full h-[30px] w-[30px] cursor-pointer"></div>

      <!-- DROPDOWN -->
      <button class="relative profile"><i class="bi bi-caret-down-fill text-2xl"></i>

        <div
          class="profilemenu hidden absolute border border-[#2D2D2D] min-w-[240px] max-w-[650px] bg-white h-auto py-2 top-[2.4rem] right-0 rounded-lg text-black flex flex-col text-start px-2 z-50 text-sm">
          
          <!-- CLOSE BTNS -->
           <div class="close-btn text-black ml-auto hover:bg-gray-200 rounded-lg  py-1 px-2">X</div>

          <a class="text-black hover:bg-gray-200 rounded-lg  py-1 px-2" href="./profile.html">Profile</a>
          <div class="text-black hover:bg-gray-200 rounded-lg  py-1 px-2">logout</div>
        </div>
      </button>
      
        </div>
    </div>



<div class="bg-gray-900 flex items-center justify-center h-screen text-white">

<div class="bg-gray-800 p-8 rounded-lg w-96 shadow-lg">

<h2 class="text-2xl font-bold text-center mb-6">Admin Login</h2>

<form id="adminLoginForm">

<div class="mb-4">
<label class="block mb-2">Email</label>
<input 
type="email" 
id="adminEmail"
class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none"
placeholder="Enter admin email"
required
>
</div>

<div class="mb-6">
<label class="block mb-2">Password</label>
<input 
type="password" 
id="adminPassword"
class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none"
placeholder="Enter password"
required
>
</div>

<button 
type="submit"
class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded font-semibold"
>
Login
</button>

</form>

<p id="errorMessage" class="text-red-400 text-center mt-4"></p>

</div>
</div>


<script>
const adminEmail = "admin232@gmail.com";
const adminPassword = "admin123";

const adminLoginForm = document.getElementById("adminLoginForm");
const errorMessage = document.getElementById("errorMessage");

adminLoginForm.addEventListener("submit", function(e){

    e.preventDefault();

    const emailInput = document.getElementById("adminEmail").value;
    const passwordInput = document.getElementById("adminPassword").value;

    if(emailInput === adminEmail && passwordInput === adminPassword){
        window.location.href = "admin_page.html";
        textContent = "Approved"
    } else {
        errorMessage.textContent = "Invalid admin login";
    }

});
</script>

</body>
</html>
